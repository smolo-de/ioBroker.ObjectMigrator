name: CodeQL security analysis

# Runs on pushes to main, on pull requests and weekly (Monday 03:00 UTC, finds new queries and
# advisories without a push). Can be started by hand as well.
on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
    schedule:
        - cron: '0 3 * * 1'
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

jobs:
    analyze:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: github/codeql-action/init@v3
              with:
                  languages: javascript-typescript
                  queries: security-extended
            - uses: github/codeql-action/analyze@v3

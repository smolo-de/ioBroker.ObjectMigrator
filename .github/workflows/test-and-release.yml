name: Test and Release

# Runs on every push to main, on pull requests and on version tags. A version tag (vX.Y.Z) also
# makes a release (npm + GitHub release), see the job "deploy". Can be started by hand as well
# (Actions → "Test and Release" → "Run workflow"), with the options below.
on:
    push:
        branches: ['main']
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}
    workflow_dispatch:
        inputs:
            e2e:
                description: 'End-to-end test with js-controller, admin and history (about 5 minutes)'
                type: boolean
                default: true
            all-os:
                description: 'Adapter tests also on Windows and macOS'
                type: boolean
                default: false

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Quick checks: types (backend + admin tab), lint, known vulnerabilities of the dependencies
    check-and-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run lint
            # production dependencies only - the admin tab is bundled, its packages are dev dependencies
            - run: npm audit --omit=dev --audit-level=high

    # Unit tests, package checks and the integration test of @iobroker/testing
    adapter-tests:
        needs: check-and-lint
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                node-version: [22.x, 24.x]
                os: ${{ inputs.all-os && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run test:ts
            - run: npm run test:package
            - run: npm run test:integration

    # The adapter in a real ioBroker with the history adapter: migration, conversion, alias remap,
    # references, rollback (test/e2e/e2e.test.js)
    e2e:
        needs: adapter-tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Set up ioBroker (js-controller, admin, history 5.2.0, objectmigrator)
              run: bash scripts/ci-e2e-setup.sh
            - name: End-to-end test
              run: npm run test:e2e
            - name: ioBroker log
              if: always()
              run: tail -n 300 .e2e/iobroker-data/log/*.log 2>/dev/null || true

    # Release on a version tag (vX.Y.Z). Needs trusted publishing at npm:
    # https://docs.npmjs.com/trusted-publishers
    deploy:
        needs: [check-and-lint, adapter-tests]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write
        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: 22.x
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
